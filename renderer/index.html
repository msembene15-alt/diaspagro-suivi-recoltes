 document.getElementById('fm').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target),o={};f.forEach(function(v,k){o[k]=v});ok(o);m.classList.remove('on');save();render()};var i=document.querySelector('#fm input,#fm select');if(i)i.focus()}
function zsel(v){return Object.keys(ZONES).map(function(k){return'<option'+(k===v?' selected':'')+'>'+k+'</option>'}).join('')}
function fC(c){c=c||{};modal(c.id?'Modifier la culture':'Nouvelle culture','<div class="f2"><div><label>Culture</label><input name="nom" list="dl" required value="'+esc(c.nom)+'"><datalist id="dl">'+CULTURES.map(function(x){return'<option>'+x+'</option>'}).join('')+'</datalist></div><div><label>Parcelle (nom)</label><input name="parc" value="'+esc(c.parc)+'"></div><div><label>Zone</label><select name="zone">'+zsel(c.zone)+'</select></div><div><label>Surface (ha)</label><input name="ha" type="number" step="any" min="0" value="'+esc(c.ha)+'"></div><div><label>Date de semis</label><input name="semis" type="date" required value="'+esc(c.semis)+'"></div><div><label>Récolte prévue</label><input name="rec" type="date" required value="'+esc(c.rec)+'"></div><div class="w"><label>Tonnage prévu (t)</label><input name="tp" type="number" step="any" min="0" value="'+esc(c.tp)+'"></div><div class="w note" id="fch"></div><div class="w" id="fsug"></div></div>',function(o){if(o.rec<o.semis){toast('La récolte doit être après le semis.');return}var x={id:c.id||uid(),nom:o.nom.trim(),parc:o.parc.trim(),zone:o.zone,ha:o.ha,semis:o.semis,rec:o.rec,tp:o.tp};if(c.id)S.cultures[S.cultures.indexOf(cult(c.id))]=x;else S.cultures.push(x)});
 var dr=!!c.id,dt=!!c.id,E=function(n){return document.querySelector('#fm [name="'+n+'"]')};
 var auto=function(){var r=refOf(E('nom').value),msg='';if(r){if(+r.cycle&&E('semis').value&&!dr){E('rec').value=addDays(E('semis').value,+r.cycle);msg='Récolte calculée : semis + '+r.cycle+' jours (référentiel). Vous pouvez la modifier. '}if(+r.y&&+E('ha').value&&!dt){E('tp').value=Math.round(r.y*E('ha').value*100)/100;msg+='Tonnage prévu = rendement de référence × surface.'}}document.getElementById('fch').textContent=msg;document.getElementById('fsug').innerHTML=(S.fl.simple?'<div class="cg">'+CULTURES.map(function(n){return'<button type="button" class="cb'+(n===E('nom').value?' on':'')+'" data-a="pickC" data-i="'+n+'"><span>'+emo(n)+'</span>'+n+'</button>'}).join('')+'</div>':'')+sugHTML(E('nom').value)};
 ['nom','semis','ha'].forEach(function(n){E(n).addEventListener('input',auto)});E('rec').addEventListener('input',function(){dr=true});E('tp').addEventListener('input',function(){dt=true});auto()}
function fR(r){if(!S.cultures.length){toast('Ajoutez d’abord une culture.');return}r=r||{};
 modal(r.id?'Modifier la récolte':'Nouvelle récolte','<div class="f2"><div class="w"><label>Culture</label><select name="cid" id="rc">'+S.cultures.map(function(c){return'<option value="'+c.id+'"'+(c.id===r.cid?' selected':'')+'>'+esc(c.nom)+' – '+esc(c.parc||c.zone)+'</option>'}).join('')+'</select></div><div><label>Date</label><input name="d" id="rd" type="date" required value="'+esc(r.d||TODAY)+'"></div><div><label>Méthode</label><select name="me">'+['Manuelle','Mécanique','Mixte'].map(function(x){return'<option'+(x===r.me?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div><label>Récolté (t)</label><input name="t" type="number" step="any" min="0" required value="'+esc(r.t)+'"></div><div></div><div><label>Température (°C)</label><input name="te" id="rt" type="number" step="any" value="'+esc(r.te)+'"></div><div><label>Pluie (mm)</label><input name="pl" id="rp" type="number" step="any" min="0" value="'+esc(r.pl)+'"></div><div class="w"><button type="button" class="btn g s" id="gm">Récupérer la météo de ce jour</button> <span class="note" id="gmm"></span></div><div class="w"><label>Notes</label><textarea name="no" rows="2">'+esc(r.no)+'</textarea></div></div>',function(o){var x={id:r.id||uid(),cid:o.cid,d:o.d,me:o.me,t:o.t,te:o.te,pl:o.pl,no:o.no};if(r.id)S.recoltes[S.recoltes.map(function(q){return q.id}).indexOf(r.id)]=x;else S.recoltes.push(x)});
 document.getElementById('gm').onclick=function(){var c=cult(document.getElementById('rc').value),d=document.getElementById('rd').value,m=document.getElementById('gmm');m.textContent='Recherche…';meteoJour(c.zone,d).then(function(x){document.getElementById('rt').value=x[0]==null?'':Math.round(x[0]*10)/10;document.getElementById('rp').value=x[1]==null?'':x[1];m.textContent='Météo de '+c.zone+' récupérée.'}).catch(function(){m.textContent='Impossible : pas de connexion ou date trop récente.'})}}
function fM(m){m=m||{};modal(m.id?'Modifier la ligne':'Nouvelle ligne de marché','<div class="f2"><div><label>Produit</label><input name="p" list="dl" required value="'+esc(m.p)+'"><datalist id="dl">'+CULTURES.map(function(x){return'<option>'+x+'</option>'}).join('')+'</datalist></div><div><label>Marché</label><input name="mk" value="'+esc(m.mk)+'"></div><div><label>Mois</label><select name="m">'+MOIS.map(function(x,i){return'<option value="'+(i+1)+'"'+(+m.m===i+1?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div><label>Prix (FCFA/kg)</label><input name="prix" type="number" step="any" min="0" required value="'+esc(m.prix)+'"></div><div><label>Volume (t)</label><input name="v" type="number" step="any" min="0" value="'+esc(m.v)+'"></div><div><label>Source</label><input name="src" value="'+esc(m.src)+'"></div></div>',function(o){var x={id:m.id||uid(),p:o.p.trim(),mk:o.mk.trim(),m:+o.m,prix:o.prix,v:o.v,src:o.src.trim()};if(m.id)S.marche[S.marche.map(function(q){return q.id}).indexOf(m.id)]=x;else S.marche.push(x)})}

/* ---------- météo ---------- */
function api(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
function meteoJour(zone,date){var c=ZONES[zone],age=(D(TODAY)-D(date))/864e5,u;
 if(age<0)return Promise.reject();
 if(age<=6)u='https://api.open-meteo.com/v1/forecast?latitude='+c[0]+'&longitude='+c[1]+'&daily=temperature_2m_mean,precipitation_sum&timezone=Africa%2FDakar&past_days=7&forecast_days=1';
 else u='https://archive-api.open-meteo.com/v1/archive?latitude='+c[0]+'&longitude='+c[1]+'&start_date='+date+'&end_date='+date+'&daily=temperature_2m_mean,precipitation_sum&timezone=Africa%2FDakar';
 return api(u).then(function(j){var i=j.daily.time.indexOf(date);if(i<0)throw 0;return[j.daily.temperature_2m_mean[i],j.daily.precipitation_sum[i]]})}

/* ---------- import / export ---------- */
function dl(name,txt,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function impCsv(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var L=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim()});if(L.length<2){toast('Fichier vide.');return}var sep=L[0].indexOf(';')>=0?';':',',H=L[0].split(sep).map(norm),ix=function(n){return H.findIndex(function(h){return h.indexOf(n)===0})},n=0;
 L.slice(1).forEach(function(l){var c=l.split(sep),p=c[ix('produit')],mo=c[ix('mois')],pr=parseFloat(String(c[ix('prix')]).replace(',','.')),mi=isNaN(+mo)?MOIS.findIndex(function(x){return norm(x).slice(0,3)===norm(mo).slice(0,3)})+1:+mo;if(p&&mi>=1&&mi<=12&&!isNaN(pr)){S.marche.push({id:uid(),p:p.trim(),mk:(c[ix('march')]||'').trim(),m:mi,prix:pr,v:ix('volume')>=0?String(c[ix('volume')]||'').replace(',','.'):'',src:ix('source')>=0?(c[ix('source')]||'').trim():''});n++}});
 save();render();toast(n+' ligne(s) importée(s).')};r.readAsText(f,'utf-8')}
function impJson(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.cultures)throw 0;if(confirm('Remplacer les données de cet ordinateur par cette sauvegarde ?')){S={cultures:j.cultures||[],recoltes:j.recoltes||[],marche:j.marche||[],meteo:j.meteo||{},pb:j.pb||[],fav:j.fav||{},ref:j.ref||[],fl:j.fl||{}};save();render();toast('Sauvegarde restaurée.')}}catch(x){toast('Ce fichier n’est pas une sauvegarde valide.')}};r.readAsText(f)}
function demo(){var y=new Date().getFullYear(),a=[['Arachide','Parcelle exemple A','Kaolack',5,y+'-07-08',y+'-10-20',9],['Mil','Parcelle exemple B','Diourbel',8,y+'-07-05',y+'-10-05',6],['Riz','Parcelle exemple C','Saint-Louis',3,y+'-07-15',y+'-11-10',14],['Oignon','Parcelle exemple D','Thiès',2,y+'-11-01',(y+1)+'-03-15',30],['Piment','Parcelle exemple E','Thiès',1,y+'-09-01',y+'-12-15',4]];
 a.forEach(function(r){S.cultures.push({id:uid(),nom:r[0],parc:r[1],zone:r[2],ha:r[3],semis:r[4],rec:r[5],tp:r[6]})});var ar=S.cultures.filter(function(c){return c.nom==='Arachide'}).pop(),mi=S.cultures.filter(function(c){return c.nom==='Mil'}).pop();
 S.recoltes.push({id:uid(),cid:ar.id,d:y+'-10-28',me:'Mixte',t:'8.2',te:'31',pl:'0',no:'Exemple'},{id:uid(),cid:mi.id,d:y+'-10-06',me:'Manuelle',t:'6.4',te:'33',pl:'0',no:'Exemple'});S.pb.push({id:uid(),cid:ar.id,d:y+'-09-12',cat:'Climat / météo',pb:'Sécheresse',stade:'Floraison',g:'Modéré',pc:'15',kg:'',ac:'Irrigation d’appoint',st:'Surveillé',ale:1,no:'Exemple'});[['Arachide',110,1.5,20,40,40,10,'6,7'],['Mil',90,1,40,20,20,10,'6,7'],['Oignon',120,25,100,60,120,20,'11,12']].forEach(function(x){if(!refOf(x[0]))S.ref.push({id:uid(),nom:x[0],cycle:x[1],y:x[2],n:x[3],p:x[4],k:x[5],fmax:x[6],sem:x[7],note:'Exemple – à remplacer par vos références'})});save();render();toast('Données d’exemple ajoutées.')}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('[data-a],[data-v]');if(!t)return;
 if(t.dataset.v&&!t.dataset.a){UI.v=t.dataset.v;render();document.getElementById('main').scrollTop=0;return}
 var a=t.dataset.a,i=t.dataset.i;
 if(a==='x'){document.getElementById('md').classList.remove('on');if(t.dataset.v){UI.v=t.dataset.v;render();document.getElementById('main').scrollTop=0}}
 else if(a==='fav'){S.fav[i]=!S.fav[i];save();render()}else if(a==='fav0'){UI.f=false;render()}else if(a==='fav1'){UI.f=true;render()}
 else if(a==='info')info(i)
 else if(a==='simple'){S.fl.simple=!S.fl.simple;save();UI.v='home';render()}
 else if(a==='say')say(i);else if(a==='sayAll')say(UI.say||'');
 else if(a==='pickF'){UI.rf=i;render()}
 else if(a==='pickC'){var ec=document.querySelector('#fm [name="nom"]');ec.value=i;ec.dispatchEvent(new Event('input'))}
 else if(a==='useCycle'){var es=document.querySelector('#fm [name="semis"]'),er=document.querySelector('#fm [name="rec"]');if(!es.value)toast('Choisissez d’abord la date de semis.');else{er.value=addDays(es.value,+i);er.dispatchEvent(new Event('input'));toast('Récolte prévue : '+fd(er.value))}}
 else if(a==='useRend'){var eh=document.querySelector('#fm [name="ha"]'),et=document.querySelector('#fm [name="tp"]');if(!+eh.value)toast('Indiquez d’abord la surface (ha).');else{et.value=Math.round(+i*eh.value*100)/100;et.dispatchEvent(new Event('input'))}}
 else if(a==='addPx'){var pp=i.split('|'),bf=baseOf(pp[0]).faits[+pp[1]];S.marche.push({id:uid(),p:pp[0],mk:'',m:bf.mois||new Date().getMonth()+1,prix:Math.round(bf.n.reduce(function(x,y){return x+y},0)/bf.n.length),v:'',src:bf.s+(bf.a?' ('+bf.a+')':'')});save();render();toast('Prix ajouté à vos prix.')}
 else if(a==='newMc')fM({p:i,m:new Date().getMonth()+1})
 else if(a==='updB'){modal('Mettre à jour les données','<div class="w"><label>Adresse du fichier base-agro.json (dépôt GitHub)</label><input name="u" value="'+esc((S.cfg&&S.cfg.url)||'')+'" placeholder="https://raw.githubusercontent.com/…/base-agro.json"></div><p class="note">Le fichier est téléchargé et remplace les fiches intégrées.</p>',function(o){S.cfg={url:o.u.trim()};if(!S.cfg.url)return;api(S.cfg.url).then(function(j){if(!j.base)throw 0;S.base=j.base;save();render();toast('Fiches mises à jour ('+j.base.length+' cultures).')}).catch(function(){toast('Mise à jour impossible : vérifiez l’adresse et la connexion.')})})}
 else if(a==='newF')fF();else if(a==='editF')fF(S.ref.filter(function(r){return r.id===i})[0]);
 else if(a==='delF'){if(confirm('Supprimer cette référence ?')){S.ref=S.ref.filter(function(r){return r.id!==i});save();render()}}
 else if(a==='exF'){var LF=['culture;cycle_jours;rendement_t_ha;N;P2O5;K2O;fumier_max_t_ha;mois_semis;notes'];S.ref.forEach(function(r){LF.push([r.nom,r.cycle,r.y,r.n,r.p,r.k,r.fmax,r.sem,(r.note||'').replace(/;/g,',')].join(';'))});dl('referentiel-'+TODAY+'.csv','\uFEFF'+LF.join('\r\n'),'text/csv')}
 else if(a==='newP')fP();else if(a==='editP')fP(S.pb.filter(function(p){return p.id===i})[0]);
 else if(a==='delP'){if(confirm('Supprimer ce signalement ?')){S.pb=S.pb.filter(function(p){return p.id!==i});save();render()}}
 else if(a==='useHist'){document.getElementById('s_y').value=i;simCalc()}
 else if(a==='newC')fC();else if(a==='editC')fC(cult(i));
 else if(a==='delC'){if(confirm('Supprimer cette culture et ses récoltes ?')){S.cultures=S.cultures.filter(function(c){return c.id!==i});S.recoltes=S.recoltes.filter(function(r){return r.cid!==i});save();render()}}
 else if(a==='newR')fR();else if(a==='editR')fR(S.recoltes.filter(function(r){return r.id===i})[0]);
 else if(a==='delR'){if(confirm('Supprimer cette récolte ?')){S.recoltes=S.recoltes.filter(function(r){return r.id!==i});save();render()}}
 else if(a==='newM')fM();else if(a==='editM')fM(S.marche.filter(function(m){return m.id===i})[0]);
 else if(a==='delM'){S.marche=S.marche.filter(function(m){return m.id!==i});save();render()}
 else if(a==='yr'){UI.y+=+t.dataset.d;render()}
 else if(a==='refMet')refMet();
 else if(a==='demo')demo();
 else if(a==='exJ')dl('sauvegarde-diaspagro-recoltes-'+TODAY+'.json',JSON.stringify(S),'application/json');
 else if(a==='exC'){var L=['date;culture;zone;methode;tonnes;temperature;pluie;notes'];S.recoltes.forEach(function(r){var c=cult(r.cid)||{};L.push([r.d,c.nom,c.zone,r.me,r.t,r.te,r.pl,(r.no||'').replace(/;/g,',')].join(';'))});dl('recoltes-'+TODAY+'.csv','\uFEFF'+L.join('\r\n'),'text/csv')}
 else if(a==='wipe'){if(confirm('Effacer toutes les données de cet ordinateur ? Pensez à faire une sauvegarde avant.')){S={cultures:[],recoltes:[],marche:[],meteo:{},pb:[],fav:{},ref:[],fl:{}};save();render()}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('md').classList.remove('on')});
render();
</script></body></html>
